<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broadcaster - Live Streaming</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>📹 Broadcaster Interface</h1>
        <div class="status" id="status">Ready to broadcast</div>
        
        <div class="video-container">
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        
        <div class="controls">
            <button id="startBtn" class="btn btn-primary">Start Broadcast</button>
            <button id="stopBtn" class="btn btn-danger" disabled>Stop Broadcast</button>
        </div>
        
        <div class="info">
            <h3>Room ID: <span id="roomId">1234</span></h3>
            <p>Share this room ID with viewers</p>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/webrtc-adapter/8.2.2/adapter.min.js"></script>
    <script src="app.js"></script>
    <script>
        const localVideo = document.getElementById('localVideo');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');
        const roomId = 1234;
        
        let broadcaster = null;
        
        startBtn.onclick = async () => {
            try {
                status.textContent = 'Accessing camera...';
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720 },
                    audio: true
                });
                
                localVideo.srcObject = stream;
                status.textContent = 'Connecting to server...';
                
                broadcaster = new Broadcaster(stream, roomId);
                await broadcaster.start();
                
                status.textContent = '🔴 Broadcasting';
                startBtn.disabled = true;
                stopBtn.disabled = false;
            } catch (error) {
                status.textContent = 'Error: ' + error.message;
                console.error('Broadcast error:', error);
            }
        };
        
        stopBtn.onclick = () => {
            if (broadcaster) {
                broadcaster.stop();
                localVideo.srcObject.getTracks().forEach(track => track.stop());
                localVideo.srcObject = null;
                status.textContent = 'Broadcast stopped';
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        };
    </script>
</body>
</html>
