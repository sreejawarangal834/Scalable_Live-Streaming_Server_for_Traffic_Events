name: CI/CD Pipeline - Production Grade

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/signaling-server

jobs:
  # Job 1: Code Quality & Security
  code-quality:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: signaling-server/package-lock.json

    - name: Install dependencies
      working-directory: ./signaling-server
      run: npm ci

    - name: Run ESLint
      working-directory: ./signaling-server
      run: |
        npm install --save-dev eslint
        npx eslint . --ext .js --format json --output-file eslint-report.json || true
      continue-on-error: true

    - name: Run npm audit
      working-directory: ./signaling-server
      run: |
        npm audit --json > npm-audit.json || true
        npm audit --audit-level=moderate
      continue-on-error: true

    - name: Dependency vulnerability scan
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --file=signaling-server/package.json

    - name: SAST - CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: javascript
        queries: security-and-quality

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    - name: Upload security scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          signaling-server/eslint-report.json
          signaling-server/npm-audit.json

  # Job 2: Unit Tests
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      working-directory: ./signaling-server
      run: npm ci

    - name: Run tests with coverage
      working-directory: ./signaling-server
      run: |
        npm install --save-dev jest
        npm test -- --coverage --ci || echo "Tests not configured yet"
      continue-on-error: true

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        files: ./signaling-server/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  # Job 3: Build & Push Docker Image
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: ./signaling-server
        file: ./signaling-server/Dockerfile.production
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          VCS_REF=${{ github.sha }}
          VERSION=${{ steps.meta.outputs.version }}

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Job 4: Deploy to Kubernetes
  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://streaming.example.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Verify cluster connection
      run: |
        kubectl cluster-info
        kubectl get nodes

    - name: Create namespace if not exists
      run: |
        kubectl apply -f k8s/namespace.yaml

    - name: Deploy Redis
      run: |
        kubectl apply -f k8s/redis-deployment.yaml
        kubectl rollout status deployment/redis -n streaming-system --timeout=5m

    - name: Update image tag in deployment
      run: |
        kubectl set image deployment/signaling-server \
          signaling-server=${{ needs.build-and-push.outputs.image-tag }} \
          -n streaming-system

    - name: Deploy Signaling Server
      run: |
        kubectl apply -f k8s/signaling-server-deployment.yaml
        kubectl apply -f k8s/hpa.yaml

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/signaling-server -n streaming-system --timeout=10m

    - name: Verify deployment
      run: |
        kubectl get pods -n streaming-system -l app=signaling-server
        kubectl get svc -n streaming-system
        kubectl get hpa -n streaming-system

    - name: Run smoke tests
      run: |
        EXTERNAL_IP=$(kubectl get svc signaling-server-lb -n streaming-system -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        echo "Testing health endpoint..."
        curl -f http://${EXTERNAL_IP}:3001/health || exit 1
        echo "Testing metrics endpoint..."
        curl -f http://${EXTERNAL_IP}:3001/metrics || exit 1
        echo "✅ Smoke tests passed!"

  # Job 5: Notify Slack
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-k8s]
    if: always()
    
    steps:
    - name: Send Slack notification
      uses: slackapi/slack-github-action@v1.25.0
      with:
        payload: |
          {
            "text": "Deployment Status: ${{ needs.deploy-k8s.result }}",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🚀 Streaming System Deployment"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Status:*\n${{ needs.deploy-k8s.result == 'success' && '✅ Success' || '❌ Failed' }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Branch:*\n${{ github.ref_name }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Commit:*\n<${{ github.event.head_commit.url }}|${{ github.sha }}>"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Author:*\n${{ github.actor }}"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Message:*\n${{ github.event.head_commit.message }}"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Workflow"
                    },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # Job 6: Performance Test
  performance-test:
    name: Load Test with 5K Viewers
    runs-on: ubuntu-latest
    needs: deploy-k8s
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install viewer bot dependencies
      working-directory: ./viewer-bots
      run: npm ci

    - name: Get service endpoint
      run: |
        EXTERNAL_IP=$(kubectl get svc signaling-server-lb -n streaming-system -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        echo "SERVICE_ENDPOINT=http://${EXTERNAL_IP}:3001" >> $GITHUB_ENV

    - name: Run load test - 5000 viewers
      working-directory: ./viewer-bots
      run: |
        node viewer-bot-simple.js --users 5000 --duration 300 --delay 10
      timeout-minutes: 10

    - name: Collect metrics
      run: |
        curl -s ${SERVICE_ENDPOINT}/status > load-test-results.json
        cat load-test-results.json

    - name: Verify success rate
      run: |
        SUCCESS_RATE=$(cat load-test-results.json | jq -r '.analytics.successRate')
        echo "Success Rate: ${SUCCESS_RATE}%"
        if (( $(echo "$SUCCESS_RATE < 95" | bc -l) )); then
          echo "❌ Success rate below 95%"
          exit 1
        fi
        echo "✅ Success rate above 95%"

    - name: Upload load test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: load-test-results
        path: load-test-results.json
