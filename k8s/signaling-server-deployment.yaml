apiVersion: apps/v1
kind: Deployment
metadata:
  name: signaling-server
  namespace: streaming-system
  labels:
    app: signaling-server
    tier: backend
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: signaling-server
  template:
    metadata:
      labels:
        app: signaling-server
        tier: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: signaling-server
        image: signaling-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: websocket
          protocol: TCP
        - containerPort: 3001
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "3000"
        - name: HTTP_PORT
          value: "3001"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /live
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
---
apiVersion: v1
kind: Service
metadata:
  name: signaling-server
  namespace: streaming-system
  labels:
    app: signaling-server
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: websocket
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  selector:
    app: signaling-server
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: Service
metadata:
  name: signaling-server-lb
  namespace: streaming-system
  labels:
    app: signaling-server
spec:
  type: LoadBalancer
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: websocket
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  selector:
    app: signaling-server
