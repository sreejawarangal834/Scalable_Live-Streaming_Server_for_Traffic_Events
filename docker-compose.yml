version: '3.8'

services:
  # Signaling Server
  signaling-server:
    build:
      context: ./signaling-server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "3001:3001"
    networks:
      - streaming-network
    restart: unless-stopped

  # Janus WebRTC Gateway
  janus-gateway:
    image: canyan/janus-gateway:latest
    ports:
      - "8088:8088"
      - "8188:8188"
      - "8089:8089"
      - "8889:8889"
      - "10000-10200:10000-10200/udp"
    volumes:
      - ./janus-config:/usr/local/etc/janus:ro
    networks:
      - streaming-network
    restart: unless-stopped

  # Frontend Web Server
  web-server:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - streaming-network
    restart: unless-stopped

  # Optional: Nginx Load Balancer
  # Uncomment to enable load balancing across multiple Janus instances
  # load-balancer:
  #   image: nginx:alpine
  #   ports:
  #     - "8000:80"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   networks:
  #     - streaming-network
  #   depends_on:
  #     - janus-gateway
  #   restart: unless-stopped

networks:
  streaming-network:
    driver: bridge
